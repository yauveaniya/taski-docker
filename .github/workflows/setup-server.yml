name: Setup server (install Docker Compose v2)

# Запускается только вручную: GitHub → вкладка Actions →
# "Setup server (install Docker Compose v2)" → кнопка "Run workflow".
# Одноразовая операция: ставит на сервер плагин docker compose (v2),
# из-за отсутствия которого падал деплой с ошибкой
# "unknown shorthand flag: 'f' in -f".
on:
  workflow_dispatch:

jobs:
  install-compose-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker Compose v2 plugin on the production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "== Текущее состояние =="
            sudo docker version --format 'Docker Engine: {{.Server.Version}}' || true
            sudo docker compose version || echo "docker compose (v2): НЕ установлен"

            # Если плагин уже работает (в т.ч. под sudo, ведь деплой идёт через sudo) — выходим
            if sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 уже работает. Делать нечего."
              exit 0
            fi

            echo "== Попытка 1: установка через apt (официальный репозиторий Docker) =="
            export DEBIAN_FRONTEND=noninteractive
            if sudo apt-get update -y && sudo apt-get install -y docker-compose-plugin; then
              if sudo docker compose version >/dev/null 2>&1; then
                echo "Установлено через apt."
                sudo docker compose version
                exit 0
              fi
            fi
            echo "apt-путь не сработал (Docker, вероятно, ставился не из репозитория Docker)."

            echo "== Попытка 2: ручная установка бинарника плагина =="
            command -v curl >/dev/null 2>&1 || sudo apt-get install -y curl

            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64)  BIN_ARCH=x86_64 ;;
              aarch64|arm64) BIN_ARCH=aarch64 ;;
              armv7l)        BIN_ARCH=armv7 ;;
              *) echo "Неизвестная архитектура: $ARCH"; exit 1 ;;
            esac

            # Берём последний релиз, при неудаче — фиксированную версию
            VERSION="$(curl -fsSL https://api.github.com/repos/docker/compose/releases/latest \
              | grep -oP '"tag_name":\s*"\K[^"]+' || true)"
            if [ -z "$VERSION" ]; then
              VERSION="v2.29.7"
              echo "Не удалось определить последнюю версию, ставим фиксированную $VERSION"
            fi
            echo "Ставим Docker Compose $VERSION ($BIN_ARCH)"

            # Каталог виден и root, и обычному пользователю — важно, т.к. деплой идёт через sudo
            PLUGIN_DIR=/usr/local/lib/docker/cli-plugins
            sudo mkdir -p "$PLUGIN_DIR"
            sudo curl -fSL \
              "https://github.com/docker/compose/releases/download/${VERSION}/docker-compose-linux-${BIN_ARCH}" \
              -o "$PLUGIN_DIR/docker-compose"
            sudo chmod +x "$PLUGIN_DIR/docker-compose"

            echo "== Проверка =="
            sudo docker compose version
